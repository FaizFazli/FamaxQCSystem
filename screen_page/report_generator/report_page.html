<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Systems Reports</title>
    <link rel="icon" type="png" href="/FamaxQCSystem/assets/LogoRound.png?v=2">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- Shared design system (tokens + UI primitives) -->
    <link rel="stylesheet" href="/assets/theme.css">

    <!-- Only for the rail's "Signed in as" block. Nothing else on this page
         reads it, and fillRailIdentity() below no-ops if it fails to load. -->
    <script src="/assets/app-config.js"></script>

    <style>
        /* ---- Page-specific layout (built on shared tokens in theme.css) ---- */
        html { height: 100%; }
        body { height: 100%; overflow: hidden; }

        .app-wrapper {
            display: flex;
            align-items: stretch;
            height: 100vh;
            width: 100vw;
        }

        /* ---- Identity rail (mirrors AdminLogin.html). The report list keeps
               its .nav-item / .active class names — loadReport() selects on
               both — and only the chrome around them changed. ---- */
        .rail {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            width: 284px;
            padding: 28px 24px;
            background: var(--text-main);
            color: #fff;
            overflow-y: auto;
        }

        .rail__brand {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        /* White tile: the falcon is navy/grey artwork, so it needs a light
           plate to read against the dark rail. */
        .rail__mark {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .rail__mark img { width: 100%; height: 100%; object-fit: contain; }

        .rail__name {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.2px;
            line-height: 1;
            color: #fff;
        }

        .rail__sub {
            display: block;
            margin-top: 2px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }

        .identity {
            margin-top: 28px;
            padding: var(--space-4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.06);
        }

        .identity__label,
        .rail-nav__label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }

        .identity__row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .identity__avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .identity__avatar svg { width: 17px; height: 17px; fill: rgba(255, 255, 255, 0.75); }

        .user-name {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.1px;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .access-level {
            display: inline-block;
            margin-top: var(--space-3);
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--on-primary);
            background: var(--primary);
            border-radius: var(--radius-full);
        }

        .session {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-top: 16px;
            padding-left: 2px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
        }

        .session::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: var(--radius-full);
            background: var(--success);
            flex-shrink: 0;
        }

        /* ---- Report list ---- */
        .rail-nav { margin-top: 26px; }
        .rail-nav__label { margin-bottom: 8px; padding-left: 2px; display: block; }

        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.65);
            transition: background var(--transition), color var(--transition);
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* .active is written by loadReport() — name is load-bearing. */
        .nav-item.active {
            background: var(--primary);
            color: var(--on-primary);
        }

        .nav-item svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
        }

        .rail__spacer { flex: 1; min-height: 20px; }

        /* Rail-inverted button — same shape as AdminLogin's .logout-btn, but
           this page only navigates back, so it warms to --primary not --danger. */
        .rail__back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            width: 100%;
            padding: 11px 16px;
            font-size: var(--fs-base);
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .rail__back:hover { background: var(--primary); border-color: var(--primary); }
        .rail__back svg { width: 15px; height: 15px; }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            min-width: 0;
            background: var(--bg-body);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Below 900 the rail lies down into a header strip and the report list
           wraps, so the iframe keeps most of the height. */
        @media (max-width: 900px) {
            .app-wrapper { flex-direction: column; }
            .rail {
                width: 100%;
                padding: 16px 20px;
                overflow-y: visible;
            }
            .identity {
                margin-top: 16px;
                padding: 8px 12px;
            }
            .identity__label, .session { display: none; }
            .access-level { margin-top: 0; }
            .rail-nav { margin-top: 16px; }
            .nav-list { flex-direction: row; flex-wrap: wrap; }
            .rail__spacer { display: none; }
            .rail__back { width: auto; margin-top: 16px; }
            .main-content { flex: 1; min-height: 0; }
        }
    </style>
</head>

<body>

    <div class="app-wrapper">
        <!-- Identity rail -->
        <aside class="rail">
            <div class="rail__brand">
                <!-- Falcon mark only — the FAMAX wordmark sits beside it as real
                     text. Relative path so it resolves whether the app is served
                     at / or at /FamaxQCSystem. alt="" — name is adjacent as text. -->
                <div class="rail__mark">
                    <img src="../../assets/Famax%20Falcon.png" alt="">
                </div>
                <div>
                    <span class="rail__name">FAMAX</span>
                    <span class="rail__sub">Report Generator</span>
                </div>
            </div>

            <div class="identity">
                <div class="identity__label">Signed in as</div>
                <div class="identity__row">
                    <span class="identity__avatar" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                        </svg>
                    </span>
                    <span class="user-name" id="userName">—</span>
                </div>
                <span class="access-level" id="accessLevel" style="display:none"></span>
            </div>

            <div class="session" id="railSession" style="display:none">Session active</div>

            <nav class="rail-nav">
                <span class="rail-nav__label">Reports</span>

            <ul class="nav-list">
                <li class="nav-item active" onclick="loadReport('buy_off_report.html', this)">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l2 2 4-4"></path>
                    </svg>
                    Buy-Off Report
                </li>
                <li class="nav-item" onclick="loadReport('ipqc_report.html', this)">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    IPQC Report
                </li>
                <li class="nav-item" onclick="loadReport('ipqc_report.html', this)">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                    </svg>
                    IQC Report
                </li>
                <li class="nav-item" onclick="loadReport('ipqc_report.html', this)">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                        </path>
                    </svg>
                    OQC Report
                </li>
                <li class="nav-item" onclick="loadReport('by_parts_report.html', this)">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4M21 12H3">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3L4 7v10l8 4 8-4V7l-8-4z">
                        </path>
                    </svg>
                    By Parts Report
                </li>
            </ul>
            </nav>

            <div class="rail__spacer"></div>

            <a href="../../AdminLogin.html" class="rail__back">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </a>
        </aside>

        <!-- Content -->
        <main class="main-content">
            <iframe id="reportFrame" src="buy_off_report.html"></iframe>
            <iframe id="reportFrame" src="generateReport.html"></iframe>
            <iframe id="reportFrame" src="generateReport.html"></iframe>
            <iframe id="reportFrame" src="generateReport.html"></iframe>
        </main>
    </div>

    <script>
        function loadReport(url, element) {
            // Update Iframe
            document.getElementById('reportFrame').src = url;

            // Update Active UI
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }

        /* Rail identity — display only. Writes into #userName / #accessLevel /
           #railSession and nothing else, and every step is guarded so a missing
           config or an unreachable database leaves the rail on its placeholder
           rather than throwing. Same session keys AdminLogin writes. */
        (async function fillRailIdentity() {
            const userId = sessionStorage.getItem('userId');
            if (sessionStorage.getItem('isLoggedIn') !== 'true' || !userId) return;

            document.getElementById('userName').textContent = userId;
            document.getElementById('railSession').style.display = 'flex';

            if (!window.APP_CONFIG) return;
            try {
                const res = await fetch(
                    `${window.APP_CONFIG.url}/rest/v1/AdminCredential` +
                    `?select=Access&UserId=eq.${encodeURIComponent(userId)}&limit=1`,
                    {
                        headers: {
                            apikey: window.APP_CONFIG.key,
                            Authorization: `Bearer ${window.APP_CONFIG.key}`,
                        },
                    }
                );
                if (!res.ok) return;
                const rows = await res.json();
                if (rows && rows.length) {
                    const badge = document.getElementById('accessLevel');
                    badge.textContent = rows[0].Access === 'ALL' ? 'Superuser' : rows[0].Access;
                    badge.style.display = 'inline-block';
                }
            } catch (e) {
                console.error('Access lookup failed', e);
            }
        })();
    </script>
    <div class="footer">© 2025 Famax Technology (M) Sdn. Bhd. All rights reserved.</div>
</body>

</html>
