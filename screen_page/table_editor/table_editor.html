<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPQC Management - Famax</title>
    <link rel="icon" type="png" href="/FamaxQCSystem/assets/LogoRound.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/assets/app-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.js"></script>

    <link rel="stylesheet" href="/assets/theme.css">

    <style>
        /* Page-specific tokens not in the design system */
        :root {
            --text-dark: var(--text-main);
            --special-bg: #fffbeb;
        }

        /* ---- Shell: identity rail + content column (mirrors AdminLogin.html).
               The date filter that used to sit in an unstyled .header-nav strip
               is the rail's control now — it is the only thing on this page that
               selects what you are looking at. ---- */
        body {
            display: flex;
            align-items: flex-start;
            padding: 0;
            background: var(--bg-body);
        }

        .column {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container { max-width: 1400px; }

        .rail {
            position: sticky;
            top: 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            width: 284px;
            height: 100vh;
            padding: 28px 24px;
            background: var(--text-main);
            color: #fff;
            overflow-y: auto;
        }

        .rail__brand {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        /* White tile: the falcon is navy/grey artwork, so it needs a light
           plate to read against the dark rail. */
        .rail__mark {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .rail__mark img { width: 100%; height: 100%; object-fit: contain; }

        .rail__name {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.2px;
            line-height: 1;
            color: #fff;
        }

        .rail__sub {
            display: block;
            margin-top: 2px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }

        .identity {
            margin-top: 28px;
            padding: var(--space-4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.06);
        }

        .identity__label,
        .rail-filter__label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }

        .identity__row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .identity__avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .identity__avatar svg { width: 17px; height: 17px; fill: rgba(255, 255, 255, 0.75); }

        .user-name {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.1px;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .access-level {
            display: inline-block;
            margin-top: var(--space-3);
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--on-primary);
            background: var(--primary);
            border-radius: var(--radius-full);
        }

        .session {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-top: 16px;
            padding-left: 2px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
        }

        .session::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: var(--radius-full);
            background: var(--success);
            flex-shrink: 0;
        }

        /* ---- Date filter (was .header-nav > .filter-group) ---- */
        .rail-filter { margin-top: 26px; }

        .rail-filter input[type="date"] {
            width: 100%;
            margin-top: 8px;
            padding: 9px 10px;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: var(--radius-sm);
        }

        .rail-filter input[type="date"]:hover { border-color: rgba(255, 255, 255, 0.34); }

        /* The native picker glyph is near-black, so it disappears on the rail. */
        .rail-filter input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.55;
            cursor: pointer;
        }

        .rail-filter input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }

        /* #last-sync keeps its id — the fetch writes the entry count into it. */
        #last-sync {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
        }

        .rail__spacer { flex: 1; min-height: 20px; }

        /* Rail-inverted button — same shape as AdminLogin's .logout-btn, but
           this page only navigates back, so it warms to --primary not --danger. */
        .rail__back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            width: 100%;
            padding: 11px 16px;
            font-family: var(--font-sans);
            font-size: var(--fs-base);
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .rail__back:hover { background: var(--primary); border-color: var(--primary); }
        .rail__back svg { width: 15px; height: 15px; }

        /* Below 900 the rail lies down into a header strip, same as AdminLogin. */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
                align-items: stretch;
            }
            .rail {
                position: static;
                width: 100%;
                height: auto;
                flex-direction: row;
                align-items: center;
                flex-wrap: wrap;
                gap: var(--space-4);
                padding: 16px 20px;
            }
            .identity {
                margin-top: 0;
                padding: 8px 12px;
            }
            .identity__label,
            .session {
                display: none;
            }
            .access-level { margin-top: 0; }
            .rail-filter {
                margin-top: 0;
                margin-left: auto;
            }
            .rail-filter input[type="date"] { width: auto; }
            #last-sync { display: none; }
            .rail__spacer { display: none; }
            .rail__back { width: auto; }
        }

        /* Part Cards (main accordions) — reuse .panel surface, keep .glass-card hook */
        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .part-card {
            margin-bottom: var(--space-5);
            overflow: hidden;
        }

        .part-header {
            background: #1e293b;
            color: #fff;
            padding: var(--space-5) var(--space-6);
            font-weight: 800;
            text-transform: uppercase;
            font-size: var(--fs-base);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: var(--space-5);
            cursor: pointer;
            transition: background var(--transition);
        }

        .part-header:hover { background: #0f172a; }

        /* "Needs attention" pill — sits beside the part number, and again on any
           session inside it that still has a reading out of spec.
           Amber on a light plate so the one pill reads on both headers: the part
           header is near-black (#1e293b) and the session header is pale grey. */
        .attn-tag {
            flex-shrink: 0;
            padding: 3px 9px;
            border-radius: var(--radius-full);
            background: #fbbf24;
            color: #78350f;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .part-content {
            display: none;
            padding: var(--space-5);
            background: var(--surface-muted);
        }

        /* Session groups */
        .session-group {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: var(--space-4);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .session-header {
            background: var(--surface-muted);
            padding: var(--space-4) var(--space-5);
            display: flex;
            gap: var(--space-4);
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            font-size: var(--fs-sm);
            border-bottom: 1px solid var(--border);
            transition: background var(--transition);
        }

        .session-header:hover { background: var(--border); }

        .session-content {
            display: none;
            padding: var(--space-6);
        }

        /* Metadata grid */
        .session-meta-grid {
            display: grid;
            grid-template-columns: 200px 200px 1fr;
            gap: var(--space-8);
            margin-bottom: var(--space-6);
            padding-bottom: var(--space-6);
            border-bottom: 1px solid var(--border);
            align-items: end;
        }

        .meta-item label {
            font-size: var(--fs-xs);
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: var(--space-2);
            display: block;
        }

        .meta-item span {
            font-size: var(--fs-md);
            font-weight: 700;
            color: var(--text-main);
        }

        .meta-item input[type="text"] {
            font-weight: 600;
        }

        /* Eight columns of readings do not fit a narrow window; scroll the table
           rather than letting the page scroll sideways. */
        .table-scroll {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        /* Reading inputs (data grid cells) — keep .reading-input hook */
        .reading-input {
            width: 100% !important;
            max-width: 120px;
            background: var(--bg-card);
            font-weight: 700;
            border: 1px solid var(--border-strong);
            color: var(--text-main);
            padding: 8px 10px;
        }

        .reading-input:focus {
            background: #f0f9ff;
            border-color: var(--primary);
        }

        /* Special states — JS toggles these classes at runtime */
        .row-special-accepted {
            background-color: var(--special-bg) !important;
        }

        .out-of-spec {
            background-color: #ffe4e6 !important;
            border: 2px solid var(--danger) !important;
            color: var(--danger) !important;
        }

        /* Chevrons */
        .chevron::before {
            content: '→';
            display: inline-block;
            margin-right: var(--space-3);
            transition: transform var(--transition);
            font-weight: bold;
        }

        .active>.chevron::before {
            transform: rotate(90deg);
        }

        /* Loader overlay — JS toggles display on #overlay */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.7);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: var(--z-overlay);
        }
    </style>
</head>

<body>
    <div id="overlay">
        <div class="spinner"></div>
    </div>

    <aside class="rail">
        <div class="rail__brand">
            <!-- Falcon mark only — the FAMAX wordmark sits beside it as real
                 text. Relative path so it resolves whether the app is served at
                 / or at /FamaxQCSystem. alt="" — the name is adjacent as text. -->
            <div class="rail__mark">
                <img src="../../assets/Famax%20Falcon.png" alt="" />
            </div>
            <div>
                <span class="rail__name">FAMAX</span>
                <span class="rail__sub">Data Editor</span>
            </div>
        </div>

        <div class="identity">
            <div class="identity__label">Signed in as</div>
            <div class="identity__row">
                <span class="identity__avatar" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                    </svg>
                </span>
                <span class="user-name" id="userName">—</span>
            </div>
            <span class="access-level" id="accessLevel" style="display:none"></span>
        </div>

        <div class="session" id="railSession" style="display:none">Session active</div>

        <!-- Same input and id as before, so the change handler and the initial
             today-value in $(document).ready are untouched. -->
        <div class="rail-filter">
            <label class="rail-filter__label" for="date-filter">Select date</label>
            <input type="date" id="date-filter">
            <span id="last-sync">Loading...</span>
        </div>

        <div class="rail__spacer"></div>

        <button class="rail__back" onclick="window.location.href='../../AdminLogin.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Dashboard
        </button>
    </aside>

    <div class="column">
        <main class="container">
            <div class="page-head">
                <h1 class="page-head__title">IPQC Inspection Editor</h1>
                <p class="page-head__subtitle">
                    Open a part, then a session, to edit its machine, remarks and readings. Every field saves on blur.
                </p>
            </div>

            <div id="ipqc-content"></div>
        </main>

        <div class="footer">© 2025 Famax Technology (M) Sdn. Bhd. All rights reserved.</div>
    </div>

    <script>
        const SB_URL = window.APP_CONFIG.url;
        const SB_KEY = window.APP_CONFIG.key;
        const _supabase = window.supabase.createClient(SB_URL, SB_KEY);

        $(document).ready(function () {
            const today = new Date().toISOString().split('T')[0];
            $('#date-filter').val(today);
            fetchIPQCByDate(today);

            $('#date-filter').on('change', function () {
                fetchIPQCByDate(this.value);
            });

            fillRailIdentity();
        });

        /* Rail identity — display only, and the same session keys AdminLogin
           writes. This page does not gate on the session, so a missing one just
           leaves the placeholder and hides the badge and the status line. */
        async function fillRailIdentity() {
            const userId = sessionStorage.getItem('userId');
            if (sessionStorage.getItem('isLoggedIn') !== 'true' || !userId) return;

            $('#userName').text(userId);
            $('#railSession').css('display', 'flex');

            try {
                const { data } = await _supabase
                    .from('AdminCredential').select('Access').eq('UserId', userId).limit(1);
                if (data && data.length) {
                    $('#accessLevel')
                        .text(data[0].Access === 'ALL' ? 'Superuser' : data[0].Access)
                        .css('display', 'inline-block');
                }
            } catch (e) {
                console.error('Access lookup failed', e);
            }
        }

        // Validation logic for coloring
        /* ------------------------------------------------------------------
           "*NEED ATTENTION" tags

           Derived from the .out-of-spec marks that validateSpec already puts on
           the reading inputs, rather than from a second copy of the spec rule.
           That matters twice over: the pill can never disagree with the red
           cells the user is looking at, and validateSpec already treats a
           special-accepted row as fine — so ticking SA makes the tag disappear
           by itself, which is the whole point of it.

           "Out of spec" here is whatever validateSpec flags: a reading outside
           LSL/USL, and also a plain NG or STOP, since those are the attribute
           and machine-stop cases of the same problem.

           Parts and sessions are both collapsed by default, so without these
           pills the only way to find a point needing special accept is to open
           every card on the day.
           ------------------------------------------------------------------ */
        let attnRefreshTimer = null;

        // Debounced because validateSpec is called once per reading input — a
        // few hundred times during a render. One refresh at the end is enough,
        // and deferring it also guarantees every class is settled before we count.
        function scheduleAttentionRefresh() {
            clearTimeout(attnRefreshTimer);
            attnRefreshTimer = setTimeout(refreshAttentionTags, 60);
        }

        function refreshAttentionTags() {
            $('.part-card').each(function () {
                let partPoints = 0;

                $(this).find('.session-group').each(function () {
                    // Rows, not inputs: three readings on one point that are all
                    // out of spec are still one point to special-accept.
                    const rows = $(this).find('tbody tr').filter(function () {
                        return $(this).find('.reading-input.out-of-spec').length > 0;
                    }).length;
                    partPoints += rows;
                    // .children() so a session's own header is targeted and never
                    // a nested one, and so the part card's pill is left alone.
                    // Explicit display rather than .toggle(): both pills start with
                    // an inline display:none, and this leaves no room for jQuery to
                    // guess a default for the span.
                    $(this).children('.session-header').find('.attn-tag')
                        .css('display', rows > 0 ? 'inline-block' : 'none');
                });

                const $partTag = $(this).children('.part-header').find('.attn-tag');
                $partTag.css('display', partPoints > 0 ? 'inline-block' : 'none');
                // The count is on the part pill only: a part can span many
                // sessions, and "3" tells you whether this is one stray reading
                // or the whole run.
                if (partPoints > 0) {
                    $partTag.text(`*NEED ATTENTION (${partPoints})`);
                }
            });
        }

        function validateSpec(input, lsl, usl) {
            // Queued first, not last: the early returns below would otherwise
            // skip it for empty, NG/STOP and special-accepted readings.
            scheduleAttentionRefresh();

            const $row = $(input).closest('tr');
            const isSpecialAccept = $row.find('.special-accept-checkbox').is(':checked');
            const val = $(input).val().trim().toUpperCase();

            $(input).removeClass('out-of-spec');

            if (isSpecialAccept) return;
            if (val === "") return;

            if (val === "NG" || val === "STOP") {
                $(input).addClass('out-of-spec');
                return;
            }

            const numVal = parseFloat(val);
            const numLsl = parseFloat(lsl);
            const numUsl = parseFloat(usl);

            if (!isNaN(numVal)) {
                if ((!isNaN(numLsl) && numVal < numLsl) || (!isNaN(numUsl) && numVal > numUsl)) {
                    $(input).addClass('out-of-spec');
                }
            }
        }

        async function toggleAllSessionSA(headerCheckbox, idList) {
            const isChecked = $(headerCheckbox).is(':checked') ? 1 : 0;
            $('#overlay').css('display', 'flex');
            const { error } = await _supabase.from('Data_IPQC').update({ special_accept: isChecked }).in('id', idList);
            if (error) {
                Toastify({ text: "Error updating batch", background: "var(--danger)" }).showToast();
                $(headerCheckbox).prop('checked', !isChecked);
            } else {
                Toastify({ text: "Batch Special Accept Updated", background: "var(--success)" }).showToast();
                const $table = $(headerCheckbox).closest('table');
                $table.find('.special-accept-checkbox').prop('checked', isChecked).each(function () { revalidateRow(this); });
            }
            $('#overlay').hide();
        }

        function revalidateRow(checkbox) {
            const $row = $(checkbox).closest('tr');
            const lsl = $row.find('td:nth-child(4)').text();
            const usl = $row.find('td:nth-child(5)').text();

            $row.find('.reading-input').each(function () {
                validateSpec(this, lsl, usl);
            });

            if ($(checkbox).is(':checked')) {
                $row.addClass('row-special-accepted');
            } else {
                $row.removeClass('row-special-accepted');
            }
        }

        function toggleCollapse(element) {
            const $header = $(element);
            const $content = $header.next();
            $header.toggleClass('active');
            $content.slideToggle(250);
        }

        async function fetchIPQCByDate(dateStr) {
            if (!dateStr) return;
            $('#overlay').css('display', 'flex');

            const startOfDay = `${dateStr}T00:00:00.000Z`;
            const endOfDay = `${dateStr}T23:59:59.999Z`;

            const { data, error } = await _supabase
                .from('Data_IPQC')
                .select('*')
                .gte('created_at', startOfDay)
                .lte('created_at', endOfDay)
                .order('created_at', { ascending: false });

            if (error) {
                Toastify({ text: "Error fetching data", background: "var(--danger)" }).showToast();
                $('#overlay').hide();
                return;
            }

            renderGroupedData(data);
            $('#last-sync').text(`(${data.length} entries)`);
            $('#overlay').hide();
        }

        function renderGroupedData(data) {
            const grouped = data.reduce((acc, row) => {
                const part = row.Part_Name;
                const sessionKey = `${row.Process}|${row.JO_Number}|${row.created_at}`;
                if (!acc[part]) acc[part] = {};
                if (!acc[part][sessionKey]) {
                    acc[part][sessionKey] = {
                        process: row.Process, jo: row.JO_Number,
                        time: row.created_at, remarks: row.Remarks || '',
                        machine: row.Machine || '', points: []
                    };
                }
                acc[part][sessionKey].points.push(row);
                return acc;
            }, {});

            let html = '';
            const entries = Object.entries(grouped);

            if (entries.length === 0) {
                html = '<div class="glass-card" style="padding:50px; text-align:center; font-weight:600; color:var(--text-muted);">No records found for this date.</div>';
            } else {
                for (const [partName, sessions] of entries) {
                    html += `
                    <div class="part-card glass-card">
                        <div class="part-header chevron" onclick="toggleCollapse(this)">
                            <span>${partName}</span>
                            <span class="attn-tag" style="display:none">*NEED ATTENTION</span>
                            <span style="font-weight:400; font-size:11px; opacity:0.8; margin-left:auto;">${Object.keys(sessions).length} Sessions</span>
                        </div>
                        <div class="part-content">`;

                    for (const [sKey, s] of Object.entries(sessions)) {
                        const timeOnly = new Date(s.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        html += `
                        <div class="session-group">
                            <div class="session-header chevron" onclick="toggleCollapse(this)">
                                <span>TIME: ${timeOnly}</span>
                                <span style="color:var(--text-muted)">|</span>
                                <span>PROCESS: ${s.process}</span>
                                <span class="attn-tag" style="display:none; margin-left:auto">*NEED ATTENTION</span>
                            </div>
                            <div class="session-content">
                                <div class="session-meta-grid">
                                    <div class="meta-item"><label>JO Number</label><span>${s.jo}</span></div>
                                    <div class="meta-item">
                                        <label>Machine</label>
                                        <input type="text" value="${s.machine}" 
                                            onblur="updateSessionField('${partName}','${s.process}','${s.jo}','${s.time}', 'Machine', this.value)"
                                            placeholder="MC NO.">
                                    </div>
                                    <div class="meta-item">
                                        <label>Batch Remarks</label>
                                        <input type="text" value="${s.remarks}" 
                                            onblur="updateSessionField('${partName}','${s.process}','${s.jo}','${s.time}', 'Remarks', this.value)"
                                            placeholder="Add process remarks...">
                                    </div>
                                </div>
                                <div class="table-scroll">
                                <table class="table">
                                 <thead>
                                    <tr>
                                      <th style="width:50px; text-align:center">
                                        <input type="checkbox" class="header-sa-checkbox"
                                            onclick="toggleAllSessionSA(this, ${JSON.stringify(s.points.map(p => p.id))})"> SA
                                         </th>
                                        <th>Zone</th><th>Instrument</th><th>LSL</th><th>USL</th>
                                        <th>Reading 1</th><th>Reading 2</th><th>Reading 3</th>
                                         </tr>
                                </thead>
                                    <tbody>`;

                        s.points.sort((a, b) => a.Point_DWG_Zone - b.Point_DWG_Zone).forEach(p => {
                            const r1 = p.Reading_1 === null ? '' : p.Reading_1;
                            const r2 = p.Reading_2 === null ? '' : p.Reading_2;
                            const r3 = p.Reading_3 === null ? '' : p.Reading_3;
                            const saChecked = p.special_accept === 1 ? 'checked' : '';
                            const saRowClass = p.special_accept === 1 ? 'row-special-accepted' : '';

                            html += `
                            <tr class="${saRowClass}">
                                <td style="text-align:center">
                                    <input type="checkbox" class="special-accept-checkbox" ${saChecked} 
                                        onchange="updateSpecialAccept(${p.id}, this)">
                                </td>
                                <td style="font-weight:700">#${p.Point_DWG_Zone}</td>
                                <td><span style="background:#f1f5f9; padding:4px 8px; border-radius:6px; font-size:10px; font-weight:700;">${p.Measuring_Instrument}</span></td>
                                <td style="color:var(--text-muted)">${p.LSL_OK}</td>
                                <td style="color:var(--text-muted)">${p.USL_NG}</td>
                                <td><input type="text" class="reading-input" value="${r1}" 
                                    onkeyup="validateSpec(this, '${p.LSL_OK}', '${p.USL_NG}')"
                                    onblur="updateReading(${p.id}, 'Reading_1', this.value)"></td>
                                <td><input type="text" class="reading-input" value="${r2}" 
                                    onkeyup="validateSpec(this, '${p.LSL_OK}', '${p.USL_NG}')"
                                    onblur="updateReading(${p.id}, 'Reading_2', this.value)"></td>
                                <td><input type="text" class="reading-input" value="${r3}" 
                                    onkeyup="validateSpec(this, '${p.LSL_OK}', '${p.USL_NG}')"
                                    onblur="updateReading(${p.id}, 'Reading_3', this.value)"></td>
                            </tr>`;
                        });
                        html += `</tbody></table></div></div></div>`;
                    }
                    html += `</div></div>`;
                }
            }
            $('#ipqc-content').html(html);

            $('.reading-input').each(function () {
                const lsl = $(this).closest('tr').find('td:nth-child(4)').text();
                const usl = $(this).closest('tr').find('td:nth-child(5)').text();
                validateSpec(this, lsl, usl);
            });
        }

        async function updateSpecialAccept(rowId, checkbox) {
            const isChecked = $(checkbox).is(':checked') ? 1 : 0;
            const { error } = await _supabase.from('Data_IPQC').update({ special_accept: isChecked }).eq('id', rowId);
            if (error) {
                Toastify({ text: "Error updating Special Accept", background: "var(--danger)" }).showToast();
                $(checkbox).prop('checked', !$(checkbox).is(':checked'));
            } else {
                Toastify({ text: "Special Accept Updated", background: "var(--primary)" }).showToast();
                revalidateRow(checkbox);
            }
        }

        async function updateSessionField(part, process, jo, time, field, newVal) {
            const updateObj = {};
            updateObj[field] = newVal;
            const { error } = await _supabase.from('Data_IPQC').update(updateObj)
                .match({ Part_Name: part, Process: process, JO_Number: jo, created_at: time });

            if (error) Toastify({ text: `Error updating ${field}`, background: "var(--danger)" }).showToast();
            else Toastify({ text: `${field} Updated`, background: "var(--primary)" }).showToast();
        }

        async function updateReading(rowId, field, newVal) {
            const updateObj = {};
            updateObj[field] = newVal;
            const { error } = await _supabase.from('Data_IPQC').update(updateObj).eq('id', rowId);

            if (error) Toastify({ text: "Error saving reading", background: "var(--danger)" }).showToast();
            else Toastify({ text: "Reading Saved", background: "var(--success)" }).showToast();
        }
    </script>
</body>

</html>
