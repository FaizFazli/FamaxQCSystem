<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Raw Material Manager - Famax</title>
    <link rel="icon" type="png" href="/FamaxQCSystem/assets/LogoRound.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/assets/app-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.js"></script>

    <!-- Shared design system (tokens + UI primitives) -->
    <link rel="stylesheet" href="/assets/theme.css">

    <style>
        /* ---- Page-specific styles (built on shared tokens in theme.css) ---- */
        :root {
            /* Legacy alias used throughout this page */
            --text-dark: var(--text-main);
            --glass-bg: var(--bg-card);
            --glass-border: var(--border);
        }

        /* ---- Shell: identity rail + content column (mirrors AdminLogin.html
               and the raw-material dashboard). ---- */
        body {
            background-color: var(--bg-body);
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
        }

        .column {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* The page gradient moves here so it washes the content area only,
               not underneath the rail. */
            background: radial-gradient(at 0% 0%, hsla(210, 100%, 98%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(206, 100%, 96%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(190, 100%, 98%, 1) 0, transparent 50%);
        }

        .content { flex: 1; padding: var(--space-10) var(--space-5); }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* ---- Identity rail ---- */
        .rail {
            position: sticky;
            top: 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            width: 284px;
            height: 100vh;
            padding: 28px 24px;
            background: var(--text-main);
            color: #fff;
            overflow-y: auto;
        }

        .rail__brand { display: flex; align-items: center; gap: var(--space-3); }

        /* White tile: the falcon is navy/grey artwork, so it needs a light
           plate to read against the dark rail. */
        .rail__mark {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: #fff;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; overflow: hidden;
        }
        .rail__mark img { width: 100%; height: 100%; object-fit: contain; }

        .rail__name {
            font-size: 15px; font-weight: 700;
            letter-spacing: -0.2px; line-height: 1; color: #fff;
        }
        .rail__sub {
            display: block; margin-top: 2px;
            font-size: 9px; font-weight: 700;
            letter-spacing: 0.16em; text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }

        .identity {
            margin-top: 26px;
            padding: var(--space-4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.06);
        }
        /* Scoped to the rail: this page styles bare `label` for its form
           fields, which would otherwise capture these. */
        .rail .identity__label,
        .rail .rail-nav__label {
            display: block;
            margin: 0;
            font-size: 10px; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }
        .identity__row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .identity__avatar {
            width: 32px; height: 32px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.12);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .identity__avatar svg { width: 17px; height: 17px; fill: rgba(255, 255, 255, 0.75); }

        .user-name {
            font-size: 15px; font-weight: 700; letter-spacing: -0.1px; color: #fff;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .access-level {
            display: inline-block; margin-top: var(--space-3);
            padding: 4px 10px;
            font-size: 10px; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--on-primary); background: var(--primary);
            border-radius: var(--radius-full);
        }

        .session {
            display: flex; align-items: center; gap: var(--space-2);
            margin-top: 16px; padding-left: 2px;
            font-size: 12px; font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
        }
        .session::before {
            content: ""; width: 7px; height: 7px;
            border-radius: var(--radius-full);
            background: var(--success); flex-shrink: 0;
        }

        /* ---- Side navigation across the three raw-material screens ---- */
        .rail-nav { margin-top: 24px; display: flex; flex-direction: column; gap: 2px; }
        .rail .rail-nav__label { margin-bottom: 8px; padding-left: 2px; }

        .rail-nav__item {
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 10px 12px;
            font-family: var(--font-sans);
            font-size: 13px; font-weight: 600;
            text-align: left;
            color: rgba(255, 255, 255, 0.65);
            background: none; border: 0;
            border-radius: var(--radius-sm);
            text-decoration: none;
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
        }
        .rail-nav__item:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
        .rail-nav__item.is-active { background: var(--primary); color: var(--on-primary); }
        .rail-nav__ico { width: 18px; text-align: center; flex-shrink: 0; }

        .rail__spacer { flex: 1; min-height: 20px; }

        /* Rail-inverted button — same shape as AdminLogin's .logout-btn, but
           this page only navigates back, so it warms to --primary not --danger. */
        .rail__back {
            display: flex; align-items: center; justify-content: center;
            gap: var(--space-2);
            width: 100%; padding: 11px 16px;
            font-family: var(--font-sans);
            font-size: var(--fs-base); font-weight: 600; color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .rail__back:hover { background: var(--primary); border-color: var(--primary); }
        .rail__back svg { width: 15px; height: 15px; }

        @media (max-width: 1000px) {
            body { flex-direction: column; align-items: stretch; }
            .rail {
                position: static; width: 100%; height: auto;
                padding: 16px 20px;
            }
            .identity { margin-top: 16px; }
            .rail .identity__label, .session { display: none; }
            .rail-nav { margin-top: 16px; flex-direction: row; flex-wrap: wrap; align-items: center; }
            .rail .rail-nav__label { width: 100%; margin-bottom: 0; }
            .rail-nav__item { width: auto; }
            .rail__spacer { display: none; }
            .rail__back { width: auto; margin-top: 16px; }
            .content { padding: var(--space-6) var(--space-5); }
        }

        /* Modern Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            padding: var(--space-8);
            margin-bottom: var(--space-6);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-4);
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-8);
        }

        .header h2 {
            font-size: var(--fs-xl);
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-5);
        }

        .form-group {
            margin-bottom: var(--space-5);
            position: relative;
        }

        label {
            display: block;
            font-size: var(--fs-xs);
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-2);
            margin-left: var(--space-1);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            font-size: var(--fs-base);
            font-weight: 500;
            box-sizing: border-box;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-ring);
        }

        input[readonly] {
            background: rgba(0, 0, 0, 0.03);
            cursor: not-allowed;
            color: var(--text-muted);
        }

        /* Consistent Primary Button */
        .btn-update {
            background: var(--text-dark);
            color: white;
            border: none;
            padding: 16px;
            border-radius: var(--radius-lg);
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            font-size: var(--fs-base);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
            margin-top: var(--space-3);
            box-shadow: var(--shadow);
        }

        .btn-update:hover {
            background: #000;
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .btn-update:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Clear Button (Secondary Style) */
        .btn-clear {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: var(--fs-xs);
            font-weight: 700;
            padding: 6px 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }

        .btn-clear:hover {
            background: var(--surface-muted);
            border-color: var(--text-dark);
            color: var(--text-dark);
        }

        /* Calculation Box */
        .calc-box {
            background: var(--primary-soft);
            padding: var(--space-5);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--primary-ring);
            margin-top: var(--space-3);
            margin-bottom: var(--space-5);
        }

        /* Autocomplete List */
        .autocomplete-items {
            position: absolute;
            border: 1px solid var(--border);
            background: var(--bg-card);
            z-index: 99;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            margin-top: var(--space-1);
        }

        .autocomplete-items div {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--surface-muted);
            font-size: var(--fs-sm);
            font-weight: 500;
        }

        .autocomplete-items div:hover {
            background: var(--surface-muted);
            color: var(--primary);
        }

        #total_weight {
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 800;
            border-color: var(--primary);
        }
    </style>
</head>

<body>

    <aside class="rail">
        <div class="rail__brand">
            <!-- Falcon mark only — the FAMAX wordmark sits beside it as real
                 text. Relative path so it resolves whether the app is served at
                 / or at /FamaxQCSystem. alt="" — the name is adjacent as text. -->
            <div class="rail__mark">
                <img src="../../assets/Famax%20Falcon.png" alt="">
            </div>
            <div>
                <span class="rail__name">FAMAX</span>
                <span class="rail__sub">Raw Material</span>
            </div>
        </div>

        <div class="identity">
            <div class="identity__label">Signed in as</div>
            <div class="identity__row">
                <span class="identity__avatar" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                    </svg>
                </span>
                <span class="user-name" id="userName">—</span>
            </div>
            <span class="access-level" id="accessLevel" style="display:none"></span>
        </div>

        <div class="session" id="railSession" style="display:none">Session active</div>

        <!-- The same three raw-material screens the dashboard already links to. -->
        <nav class="rail-nav">
            <div class="rail-nav__label">Raw material</div>

            <a class="rail-nav__item" href="raw_material_dashboard.html">
                <span class="rail-nav__ico">📊</span>Dashboard
            </a>
            <a class="rail-nav__item is-active" href="raw_material_movement.html">
                <span class="rail-nav__ico">➕</span>Update Stock
            </a>
            <a class="rail-nav__item" href="raw_material_inventory.html">
                <span class="rail-nav__ico">📦</span>Inventory
            </a>
        </nav>

        <div class="rail__spacer"></div>

        <button class="rail__back" onclick="window.location.href='../../AdminLogin.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Dashboard
        </button>
    </aside>

    <div class="column">
    <main class="content">
    <div class="container">
        <div class="glass-card">
            <div class="header">
                <h2>Stock Update & Movement</h2>
                <button class="btn-clear" onclick="resetForm()">Clear Form</button>
            </div>

            <!-- 1. SEARCH EXISTING STOCK -->
            <div class="form-group">
                <label>Search Existing Stock</label>
                <input type="text" id="search_stock" placeholder="🔍 Find by Grade, Type, or Lot Number..."
                    autocomplete="off">
                <div id="search_results" class="autocomplete-items" style="display:none"></div>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 30px 0;">

            <!-- 2. MAIN FORM -->
            <div class="grid">
                <div class="form-group">
                    <label>Area / Rack</label>
                    <input type="text" id="area" placeholder="e.g., RACK F-7">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category_id">
                        <option value="">-- Select Category --</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Material Type</label>
                <input type="text" id="material_type" placeholder="e.g., COLD DRAWN 10MMX10MM" autocomplete="off">
                <div id="type_suggestions" class="autocomplete-items" style="display:none"></div>
            </div>

            <div class="grid">
                <div class="form-group">
                    <label>Grade</label>
                    <input type="text" id="grade" placeholder="e.g., C3604BD">
                </div>
                <div class="form-group">
                    <label>Size / Dimensions</label>
                    <input type="text" id="size" placeholder="e.g., Ø 10.00MM X 2500MM">
                </div>
            </div>

            <div class="grid">
                <div class="form-group">
                    <label>UOM</label>
                    <input type="text" id="uom" value="PCS">
                </div>
                <div class="form-group">
                    <label>Unit Weight (KG/PC)</label>
                    <input type="number" id="kg_per_pc" step="0.0001" placeholder="0.0000" oninput="calculateTotal()">
                </div>
            </div>

            <!-- 3. QUANTITY & MOVEMENT SECTION -->
            <div class="calc-box">
                <label style="color:var(--primary); font-size: 11px; margin-bottom: 12px;">Traceability &
                    Balance</label>

                <div class="grid" style="margin-top:10px;">
                    <div class="form-group">
                        <label>System Balance (PCS)</label>
                        <input type="number" id="current_qty" readonly value="0">
                    </div>
                    <div class="form-group">
                        <label id="ref_label">Reference Number (PO/JO/SO)</label>
                        <input type="text" id="ref_number" placeholder="Enter Reference No.">
                    </div>
                </div>

                <div class="grid">
                    <div class="form-group">
                        <label>Stock Movement (PCS)</label>
                        <input type="number" id="qty_movement" placeholder="+/- PCS" oninput="convertPcsToKg()">
                    </div>
                    <div class="form-group">
                        <label>Stock Movement (KG)</label>
                        <input type="number" id="weight_movement" step="0.001" placeholder="+/- KG"
                            oninput="convertKgToPcs()">
                    </div>
                </div>

                <div class="grid">
                    <div class="form-group">
                        <label>Calculated Final Weight</label>
                        <input type="text" id="total_weight" readonly value="0.000 KG">
                    </div>
                    <div class="form-group">
                        <label>Lot Number / Heat No.</label>
                        <input type="text" id="lot_no" placeholder="e.g., LOT-2024-05-001">
                    </div>
                </div>
                <div id="millcert_section"
                    style="display:none; margin-top: 15px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 15px;">
                    <label style="color:var(--success)">📜 Upload Mill Certificates (Inbound Only)</label>
                    <input type="file" id="mill_cert_files" multiple accept="image/*,application/pdf"
                        style="margin-top:5px;">
                    <small style="display:block; color:var(--text-muted); margin-top:5px;">You can select multiple
                        images or PDFs.</small>
                    <div id="file_preview" style="font-size: 11px; color: var(--primary); margin-top: 5px;"></div>
                </div>
            </div>

            <button class="btn-update" id="btn-submit" onclick="submitStockUpdate()">Save Transaction</button>
        </div>
    </div>
    </main>

        <div class="footer">© 2025 Famax Technology (M) Sdn. Bhd. All rights reserved.</div>
    </div>

    <script>
        const SB_URL = window.APP_CONFIG.url;
        const SB_KEY = window.APP_CONFIG.key;
        const _supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let selectedStockId = null;
        let originalMaterial = null; // To store specs of the searched item
        let searchedSnapshot = null; // Stores the "original" data from the search

        $(document).ready(function () {
            loadCategories();
            setupStockSearch();
            setupTypeSuggestions();

            // Watch identifying fields for any manual changes
            $('#grade, #material_type, #size, #kg_per_pc').on('input change', function () {
                checkMaterialConsistency();
            });

            fillRailIdentity();
        });

        /* Rail identity — display only. Writes into the three rail elements and
           nothing else; reuses the client above and swallows its own failure. */
        async function fillRailIdentity() {
            const userId = sessionStorage.getItem('userId');
            if (!userId) return;
            $('#userName').text(userId);
            $('#railSession').css('display', 'flex');
            try {
                const { data } = await _supabase
                    .from('AdminCredential').select('Access').eq('UserId', userId).limit(1);
                if (data && data.length) {
                    $('#accessLevel')
                        .text(data[0].Access === 'ALL' ? 'Superuser' : data[0].Access)
                        .css('display', 'inline-block');
                }
            } catch (e) { console.error('Access lookup failed', e); }
        }

        async function loadCategories() {
            const { data, error } = await _supabase.from('RawMaterialCategory').select('*').order('category_name');
            if (error) return console.error(error);

            $('#category_id').html('<option value="">-- Select Category --</option>');
            data.forEach(c => {
                $('#category_id').append(`<option value="${c.id}">${c.category_name}</option>`);
            });
        }

        function setupStockSearch() {
            $('#search_stock').on('focus input', async function () {
                const val = $(this).val();

                let query = _supabase.from('RawMaterialStock').select('*');
                if (val.length > 0) {
                    query = query.or(`material_type.ilike.%${val}%,grade.ilike.%${val}%,last_lot_no.ilike.%${val}%`);
                }

                const { data, error } = await query.order('id', { ascending: false }).limit(8);
                if (error || !data) return;

                let html = '';
                data.forEach(item => {
                    const lotInfo = item.last_lot_no ? ` [Lot: ${item.last_lot_no}]` : "";
                    html += `<div class="search-item" data-id="${item.id}">
                    <strong>${item.grade || 'N/A'}</strong> - <small>${item.material_type || ''}${lotInfo}</small>
                </div>`;
                });

                $('#search_results').html(html).show();

                $('.search-item').on('mousedown', function () {
                    const id = $(this).data('id');
                    const targetItem = data.find(i => i.id == id);
                    fillForm(targetItem);
                });
            });

            $(document).on('mousedown', function (e) {
                if (!$(e.target).closest('.form-group').length) {
                    $('#search_results').hide();
                }
            });
        }

        window.fillForm = function (item) {
            selectedStockId = item.id;

            // TAKE SNAPSHOT: Store the identifying specs
            searchedSnapshot = {
                grade: (item.grade || "").toUpperCase(),
                type: (item.material_type || "").toUpperCase(),
                size: (item.size_dimensions || "").toUpperCase(),
                unitWeight: parseFloat(item.kg_per_pc) || 0
            };

            $('#area').val(item.area || "");
            $('#material_type').val(item.material_type || "");
            $('#grade').val(item.grade || "");
            $('#size').val(item.size_dimensions || "");
            $('#uom').val(item.uom || "PCS");
            $('#kg_per_pc').val(item.kg_per_pc || 0);
            $('#current_qty').val(item.qty_pcs || 0);
            $('#lot_no').val(item.last_lot_no || '');

            if (item.product_category) {
                $('#category_id').val(item.product_category);
            }

            $('#category_id').prop('disabled', true);
            $('#search_results').hide();
            $('#search_stock').val(item.grade);

            calculateTotal();
        };

        function setupTypeSuggestions() {
            $('#material_type').on('input', async function () {
                const val = $(this).val();
                if (val.length < 2) return $('#type_suggestions').hide();

                const { data } = await _supabase.from('RawMaterialStock')
                    .select('material_type')
                    .ilike('material_type', `%${val}%`)
                    .limit(5);

                if (data && data.length > 0) {
                    let html = '';
                    const uniqueTypes = [...new Set(data.map(i => i.material_type))];
                    uniqueTypes.forEach(t => {
                        html += `<div onclick="$('#material_type').val('${t}'); $('#type_suggestions').hide();">${t}</div>`;
                    });
                    $('#type_suggestions').html(html).show();
                }
            });
        }
        // Bi-directional Calculation Logic
        function convertPcsToKg() {
            const pcs = parseFloat($('#qty_movement').val()) || 0;
            const kgPerPc = parseFloat($('#kg_per_pc').val()) || 0;

            if (kgPerPc > 0) {
                const kg = (pcs * kgPerPc).toFixed(3);
                $('#weight_movement').val(kg);
            }
            updateRefLabel(pcs);
            calculateTotal();
        }

        function convertKgToPcs() {
            const kg = parseFloat($('#weight_movement').val()) || 0;
            const kgPerPc = parseFloat($('#kg_per_pc').val()) || 0;

            if (kgPerPc > 0) {
                const pcs = Math.round(kg / kgPerPc);
                $('#qty_movement').val(pcs);
            }
            updateRefLabel(kg);
            calculateTotal();
        }

        function updateRefLabel(value) {
            const label = $('#ref_label');
            const input = $('#ref_number');
            const millCertSection = $('#millcert_section');

            if (value > 0) {
                label.text("PO Number (Inbound)");
                input.attr("placeholder", "Enter Purchase Order No.");
                millCertSection.fadeIn(); // Show upload for + movement
            } else if (value < 0) {
                label.text("JO / SO Number (Outbound)");
                input.attr("placeholder", "Enter Job Order or Sales Order No.");
                millCertSection.fadeOut(); // Hide for - movement
                $('#mill_cert_files').val(''); // Clear files
            } else {
                label.text("Reference Number");
                input.attr("placeholder", "Enter Ref No.");
                millCertSection.fadeOut();
            }
        }

        function calculateTotal() {
            // This value is forced to 0 by the checker if specs change
            const currentQtyPcs = parseFloat($('#current_qty').val()) || 0;
            const moveQtyPcs = parseFloat($('#qty_movement').val()) || 0;
            const kgPerPc = parseFloat($('#kg_per_pc').val()) || 0;

            const finalQtyPcs = currentQtyPcs + moveQtyPcs;
            const finalWeightKg = (finalQtyPcs * kgPerPc).toFixed(3);

            $('#total_weight').val(finalWeightKg + " KG");
        }

        function checkMaterialConsistency() {
            // 1. Get current values
            const currentGrade = $('#grade').val().trim().toUpperCase();
            const currentType = $('#material_type').val().trim().toUpperCase();
            const currentSize = $('#size').val().trim().toUpperCase();
            const currentUnitWeight = parseFloat($('#kg_per_pc').val()) || 0;

            // 2. Only check if we previously selected an item from search
            if (searchedSnapshot) {
                // Compare against the snapshot
                const isDifferent = (
                    currentGrade !== searchedSnapshot.grade ||
                    currentType !== searchedSnapshot.type ||
                    currentSize !== searchedSnapshot.size ||
                    currentUnitWeight !== searchedSnapshot.unitWeight
                );

                if (isDifferent) {
                    console.log("Specs changed: Resetting System Balance to 0");

                    // RESET logic
                    selectedStockId = null;     // No longer linked to the database ID
                    $('#current_qty').val(0);   // System Balance becomes 0
                    $('#category_id').prop('disabled', false); // Allow category change

                    // Force recalculation of final weight based on 0 balance
                    calculateTotal();
                }
            } else {
                // If no item was searched, ensure balance stays 0
                $('#current_qty').val(0);
                calculateTotal();
            }
        }

        // Updated Submission with Validation
        // --- 1. MAIN SUBMISSION FUNCTION ---
        async function submitStockUpdate() {
            // 1. Collect Input Data
            const kgPerPc = parseFloat($('#kg_per_pc').val()) || 0;
            const moveQty = parseFloat($('#qty_movement').val()) || 0;
            const refNo = $('#ref_number').val().trim();
            const lotNo = $('#lot_no').val().toUpperCase();
            const grade = $('#grade').val().toUpperCase();
            const matType = $('#material_type').val().toUpperCase();
            const size = $('#size').val().toUpperCase();
            const area = $('#area').val().toUpperCase();
            const category = $('#category_id').val();
            const uom = $('#uom').val().toUpperCase();

            // --- Validation ---
            if (!grade || !matType || !size) {
                alert("Required: Grade, Material Type, and Size/Dimensions cannot be empty.");
                return;
            }
            if (moveQty !== 0 && !refNo) {
                alert(`Required: Please enter a Reference Number.`);
                return;
            }
            if (kgPerPc <= 0) {
                alert("Invalid Unit Weight. Please enter KG/PC.");
                return;
            }

            const $btn = $('#btn-submit');
            $btn.prop('disabled', true).text('Checking database...');

            try {
                // --- Step 1: SMART LOGIC (Updated to include Weight) ---
                // We now check Grade + Type + Size + KG_PER_PC
                const { data: match, error: matchErr } = await _supabase
                    .from('RawMaterialStock')
                    .select('id, qty_pcs')
                    .eq('grade', grade)
                    .eq('material_type', matType)
                    .eq('size_dimensions', size)
                    .eq('kg_per_pc', kgPerPc) // <--- ADDED THIS LINE
                    .maybeSingle();

                if (matchErr) throw matchErr;

                // Calculate Final Quantity
                const baseQty = match ? match.qty_pcs : 0;
                const finalQty = baseQty + moveQty;

                if (finalQty < 0) {
                    alert(`Error: Insufficient stock. This specific material (with weight ${kgPerPc} KG/PC) only has ${baseQty} PCS in balance.`);
                    $btn.prop('disabled', false).text('Save Transaction');
                    return;
                }

                // --- Step 2: Handle File Uploads ---
                let certPaths = [];
                if (moveQty > 0) {
                    $btn.text('Uploading Mill Certificates...');
                    certPaths = await uploadMillCerts(grade, matType);
                }

                // --- Step 3: Prepare Stock Data ---
                $btn.text('Updating Inventory...');
                const stockData = {
                    area: area,
                    product_category: category,
                    material_type: matType,
                    grade: grade,
                    size_dimensions: size,
                    uom: uom,
                    kg_per_pc: kgPerPc,
                    qty_pcs: finalQty,
                    total_weight_kg: finalQty * kgPerPc,
                    last_lot_no: lotNo,
                };

                let finalId;
                if (match) {
                    // Update existing record because all 4 specs match
                    const { data: updateRes, error: updateErr } = await _supabase
                        .from('RawMaterialStock')
                        .update(stockData)
                        .eq('id', match.id)
                        .select();
                    if (updateErr) throw updateErr;
                    finalId = match.id;
                } else {
                    // Create NEW record because no match was found for this specific Weight/Size combo
                    const { data: insertRes, error: insertErr } = await _supabase
                        .from('RawMaterialStock')
                        .insert([stockData])
                        .select();
                    if (insertErr) throw insertErr;
                    finalId = insertRes[0].id;
                }

                // --- Step 4: Record Movement ---
                if (moveQty !== 0) {
                    $btn.text('Logging Movement...');
                    await _supabase.from('RawMaterialMovement').insert([{
                        material_id: finalId,
                        move_type: moveQty > 0 ? 'IN' : 'OUT',
                        qty_change: Math.abs(moveQty),
                        weight_change: Math.abs(parseFloat($('#weight_movement').val()) || 0),
                        lot_no: lotNo,
                        ref_no: refNo,
                        reason: (moveQty > 0 ? "PO: " : "Ref: ") + refNo,
                        mill_cert_urls: certPaths
                    }]);
                }

                Toastify({ text: "TRANSACTION SAVED SUCCESSFULLY", background: "var(--success)" }).showToast();
                setTimeout(() => location.reload(), 1500);

            } catch (err) {
                console.error("Critical Error:", err);
                alert("System Error: " + (err.message || "Unknown error occurred"));
                $btn.prop('disabled', false).text('Save Transaction');
            }
        }

        // --- 2. STORAGE UPLOAD HELPER FUNCTION ---
        async function uploadMillCerts(grade, materialType) {
            const fileInput = $('#mill_cert_files')[0];
            const files = fileInput.files;

            // If no files selected, return empty array
            if (files.length === 0) return [];

            const uploadedPaths = [];
            const dateFolder = new Date().toISOString().split('T')[0]; // Format: YYYY-MM-DD

            // Clean folder names (remove spaces and special characters for URL safety)
            const cleanGrade = grade.replace(/[^a-z0-9]/gi, '_');
            const cleanType = materialType.replace(/[^a-z0-9]/gi, '_');

            for (const file of files) {
                // Create unique filename: Timestamp_RandomID.extension
                const fileExt = file.name.split('.').pop();
                const uniqueID = Math.random().toString(36).substring(7);
                const fileName = `${Date.now()}_${uniqueID}.${fileExt}`;

                // Final Path: Grade/MaterialType/Date/Filename
                const filePath = `${cleanGrade}/${cleanType}/${dateFolder}/${fileName}`;

                const { data, error } = await _supabase.storage
                    .from('rawmaterialmillcert')
                    .upload(filePath, file, {
                        cacheControl: '3600',
                        upsert: false
                    });

                if (error) {
                    console.error(`Upload failed for ${file.name}:`, error.message);
                    // Optionally: alert the user but continue with other files
                } else {
                    // Store the path returned by Supabase
                    uploadedPaths.push(data.path);
                }
            }

            return uploadedPaths; // Array of strings
        }

        function resetForm() {
            selectedStockId = null;
            searchedSnapshot = null; // Clear the snapshot
            $('input, textarea').val('');
            $('#qty_movement').val(0);
            $('#weight_movement').val(0);
            $('#current_qty').val(0);
            $('#uom').val('PCS');
            $('#category_id').prop('disabled', false).val('');
            $('#total_weight').val("0.000 KG");
        }
    </script>
