<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Famax | Out-of-Spec (OOS) Report</title>
    <link rel="icon" type="png" href="/FamaxQCSystem/assets/LogoRound.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/app-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

    <!-- Shared design system (tokens + UI primitives) -->
    <link rel="stylesheet" href="/assets/theme.css" />

    <style>
        .is-framed .card-header {
            display: none !important;
        }

        /* ---- Page-specific layout (built on shared tokens in theme.css) ---- */
        :root {
            --oos-danger: #e11d48;
        }

        body {
            padding: var(--space-3);
        }

        @media (min-width: 768px) {
            body {
                padding: var(--space-5);
            }
        }

        .page-container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card-header {
            background: var(--oos-danger);
            padding: var(--space-4) var(--space-5);
            color: var(--on-primary);
        }

        .card-header h1 {
            margin: 0;
            font-size: var(--fs-md);
            font-weight: 700;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .toolbar {
            background: var(--surface-muted);
            padding: var(--space-5);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin: var(--space-8) var(--space-8) 0;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: var(--space-4);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .filter-group label {
            font-size: var(--fs-xs);
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        select,
        input[type="month"] {
            min-width: 150px;
            width: auto;
        }

        .btn {
            height: 42px;
        }

        .btn-blue {
            background: var(--primary);
        }

        .btn-blue:hover {
            background: var(--primary-hover);
        }

        .btn-green {
            background: var(--success);
        }

        .btn-green:hover {
            background: #059669;
        }

        .report-content {
            padding: var(--space-4);
        }

        @media (min-width: 768px) {
            .report-content {
                padding: var(--space-8);
            }
        }

        /* JS renders part group headers into .report-content */
        .part-group-header {
            background: var(--surface-muted);
            padding: var(--space-3) var(--space-4);
            font-weight: 700;
            font-size: var(--fs-base);
            margin-top: var(--space-6);
            border-left: 4px solid var(--oos-danger);
            border-radius: var(--radius-sm);
            display: flex;
            justify-content: space-between;
        }

        .table-responsive {
            overflow-x: auto;
            margin-bottom: var(--space-3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: var(--surface-muted);
            border: 1px solid var(--border);
            padding: var(--space-3);
            font-size: var(--fs-xs);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: left;
        }

        td {
            border: 1px solid var(--border);
            padding: var(--space-3);
            font-size: var(--fs-sm);
            vertical-align: top;
        }

        .oos-bold {
            color: var(--oos-danger);
            font-weight: 800;
            background: #fff1f2;
            padding: 2px 4px;
            border-radius: var(--radius-sm);
        }

        /* .col-read {
            width: 75px;
            text-align: center;
            white-space: nowrap;
            /* Prevents 207.614 from breaking */
        /* } */

        /* .remark-text {
        font-size: var(--fs-xs);
        white-space: pre-wrap; 
        word-break: break-word;
        line-height: 1.4;
        min-height: 24px;
    } */

        .remark-text {
            font-size: var(--fs-xs);
            color: var(--text-main);
            padding: var(--space-1);
            min-height: 24px;
            cursor: text;
            outline: none;
            border-radius: var(--radius-sm);
            transition: background var(--transition);
            /* Ensures long text wraps and shows fully */
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
        }

        .remark-text:focus {
            background: var(--primary-soft);
        }

        /* The remark picker holds whole sentences — "Surface defect (dent /
           burr / line / vibration / off-center)" — so it needs room the month
           box does not. */
        #remarkPicker {
            min-width: 260px;
            max-width: 440px;
        }

        /* Which parts the selected remark landed on, and how many points of
           each. It sits above the detail tables and answers the question people
           open this report with, so it prints with them. */
        .summary-panel {
            border: 1px solid var(--border);
            border-left: 4px solid var(--oos-danger);
            border-radius: var(--radius-sm);
            padding: var(--space-4);
            margin-bottom: var(--space-6);
            background: var(--bg-card);
        }

        .summary-panel h3 {
            margin: 0 0 var(--space-1);
            font-size: var(--fs-base);
            font-weight: 700;
        }

        .summary-caption {
            margin: 0 0 var(--space-3);
            font-size: var(--fs-xs);
            color: var(--text-muted);
        }

        /* Overrides the 1000px minimum every other table on this page needs to
           keep nine columns apart — this one has four. */
        .summary-panel table {
            min-width: 0;
        }

        .summary-panel td {
            font-size: var(--fs-sm);
        }

        .summary-total td {
            font-weight: 700;
            background: var(--surface-muted);
        }

        .num {
            text-align: right;
            white-space: nowrap;
        }

        .footer {
            text-align: center;
            padding: var(--space-5);
            color: var(--text-faint);
            font-size: var(--fs-xs);
        }

        .saving {
            opacity: 0.5;
            pointer-events: none;
        }



        /* TABLE STYLES FOR WEB VIEW */
        .col-read {
            width: 85px;
            text-align: center;
            white-space: nowrap;
        }

        .remark-text {
            font-size: var(--fs-xs);
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
            min-height: 20px;
            display: block;
        }

        /* --- PRINT STYLES --- */
        @media print {
            @page {
                size: portrait;
                margin: 0.5cm;
            }

            /* Hide Top UI */
            .toolbar,
            .card-header,
            .footer,
            .btn {
                display: none !important;
            }

            body {
                padding: 0 !important;
                background: white !important;
            }

            .page-container {
                width: 100% !important;
                border: none !important;
                box-shadow: none !important;
                margin: 0 !important;
            }

            table {
                table-layout: fixed !important;
                /* Force browser to obey widths below */
                width: 100% !important;
                border-collapse: collapse !important;
            }

            th,
            td {
                font-size: 7pt !important;
                /* Very small to fit all 9 columns */
                padding: 3px 2px !important;
                border: 1px solid #e2e8f0 !important;
                vertical-align: top !important;
                word-wrap: break-word !important;
            }

            /* Calibrated widths for Portrait A4 */
            .col-date {
                width: 65px !important;
            }

            .col-machine {
                width: 55px !important;
            }

            .col-process {
                width: 75px !important;
            }

            .col-zone {
                width: 35px !important;
            }

            .col-spec {
                width: 75px !important;
                text-align: center !important;
            }

            .col-read {
                width: 58px !important;
                white-space: nowrap !important;
                text-align: center !important;
            }

            .col-remarks {
                width: auto !important;
            }

            /* Remarks takes all remaining space */

            .remark-text {
                font-size: 7pt !important;
                line-height: 1.1 !important;
                text-align: left !important;

                /* These three are the "Magic Combo" for table wrapping */
                display: block !important;
                white-space: pre-wrap !important;
                /* Keeps manual line breaks and wraps text */
                overflow-wrap: anywhere !important;
                /* Forces a break at the edge of the cell even if it's one long word */

                /* Ensure it doesn't try to be wider than the column */
                width: 100% !important;
                word-break: normal !important;
            }

            .oos-bold {
                background-color: #fff1f2 !important;
                color: #e11d48 !important;
                border: 1px solid #fecdd3 !important;
                padding: 0 2px !important;
                font-weight: 700 !important;
            }
        }
    </style>

</head>

<body>
    <div class="page-container">
        <div class="card-header">
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                Out-of-Spec Report
            </h1>
        </div>

        <div class="toolbar">
            <div class="filter-group">
                <label>Select Month</label>
                <input type="month" id="monthPicker" onchange="generateReport()">
            </div>

            <!-- Built from the remarks the month actually contains, not from a
                 fixed vocabulary: rows written before the standard list existed,
                 and anything filed under "Other", are free text and still have
                 to be selectable. -->
            <div class="filter-group">
                <label>Remark</label>
                <select id="remarkPicker" onchange="applyRemarkFilter()">
                    <option value="__all__">All remarks</option>
                </select>
            </div>

            <div style="margin-left: auto; display: flex; gap: var(--space-4);">
                <button class="btn btn-blue" onclick="generateReport()">Update Report</button>
                <button class="btn" style="background: #475569; color: white;" onclick="window.print()">Print
                    Report</button>
                <button id="exportBtn" class="btn btn-green" onclick="exportToExcel()" disabled>Export to Excel</button>
            </div>
        </div>

        <div id="reportContent" class="report-content">
            <p style="text-align:center; color:#64748b;">Loading data...</p>
        </div>
    </div>

    <div class="footer">© 2025 Famax Technology (M) Sdn. Bhd. All rights reserved.</div>

    <script>
        // ... Keep existing Supabase, logic, generateReport, and saveRemark functions exactly as they were ...
        const SUPABASE_URL = window.APP_CONFIG.url;
        const SUPABASE_KEY = window.APP_CONFIG.key;
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let globalOOSData = [];      // the whole month, whatever the filter says
        let remarkGroups = [];       // one entry per distinct remark, biggest first
        let activeRemark = "__all__";
        let activeMonth = "";

        window.onload = () => {
            const currentMonth = dayjs().format("YYYY-MM");
            document.getElementById("monthPicker").value = currentMonth;
            generateReport();
        };

        // Remarks are free text and always will be, so they are escaped rather
        // than trusted: a stray < in a typed remark otherwise eats the rest of
        // the cell.
        const esc = (v) => String(v ?? "")
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");

        // ---------------------------------------------------------------
        // Reading remarks that were never standardised
        //
        // IPQC writes Remarks as "<category> | <free detail>" and takes the
        // category from a fixed list — but "Other" writes the detail on its
        // own, and rows recorded before that list existed are free text end to
        // end. So the filter cannot assume the vocabulary. It groups on the
        // CATEGORY, meaning everything before the first "|", because the detail
        // is deliberately unique per inspection and grouping on it would give
        // one group per row.
        //
        // The key folds the ways the same remark differs when it is typed twice
        // instead of picked from the list: case, runs of whitespace, trailing
        // punctuation, and the separator — "Tooling problem / broken",
        // "tooling problem/broken" and "Tooling problem – broken." are one
        // remark, because / - – — between words are the same word here.
        //
        // Nothing beyond that is folded. Deciding that two unlike sentences
        // mean the same thing is a judgement about the factory's words, not one
        // this page gets to make, so two old remarks that mean the same stay
        // two entries — visible, countable, and fixable by editing the remark.
        // Where folding DID happen the summary panel names every spelling it
        // merged, so a count nobody can reproduce by eye is never silent.
        // ---------------------------------------------------------------
        function remarkCategory(text) {
            const s = String(text ?? "").replace(/\s+/g, " ").trim();
            const bar = s.indexOf("|");
            return (bar === -1 ? s : s.slice(0, bar)).trim();
        }

        function remarkKey(text) {
            return remarkCategory(text)
                .toUpperCase()
                .replace(/[‐-―]/g, "-")             // en and em dashes are typed as - too
                .replace(/\s*[\/-]+\s*/g, " / ")     // "a/b", "a / b" and "a - b" are one remark
                .replace(/[.,;:]+$/, "")
                .replace(/\s+/g, " ")
                .replace(/^\s*\/\s*|\s*\/\s*$/g, "")
                .trim();
        }

        // Rows arrive newest first, so the label of a group is its most recent
        // spelling — the closest thing to what the floor writes today.
        function buildRemarkGroups(rows) {
            const map = new Map();
            rows.forEach((r) => {
                if (!map.has(r.remarkKey)) {
                    map.set(r.remarkKey, {
                        key: r.remarkKey,
                        label: r.remarkCategory || "(No remark)",
                        count: 0,
                        spellings: new Set()
                    });
                }
                const g = map.get(r.remarkKey);
                g.count += 1;
                if (r.remarkCategory) g.spellings.add(r.remarkCategory);
            });
            return [...map.values()]
                .sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
        }

        function fillRemarkPicker() {
            const sel = document.getElementById("remarkPicker");
            const previous = activeRemark;
            sel.innerHTML = "";

            const all = document.createElement("option");
            all.value = "__all__";
            all.textContent = `All remarks — ${globalOOSData.length} point${globalOOSData.length === 1 ? "" : "s"}`;
            sel.appendChild(all);

            remarkGroups.forEach((g) => {
                const o = document.createElement("option");
                o.value = g.key;
                // textContent, not innerHTML: the label is somebody's typing.
                o.textContent = `${g.label} — ${g.count} point${g.count === 1 ? "" : "s"}`
                    + (g.spellings.size > 1 ? ` (${g.spellings.size} spellings)` : "");
                sel.appendChild(o);
            });

            // A remark stays selected across a month change when the new month
            // has it, so stepping back through months follows one problem.
            activeRemark = remarkGroups.some((g) => g.key === previous) ? previous : "__all__";
            sel.value = activeRemark;
        }

        function visibleRows() {
            return activeRemark === "__all__"
                ? globalOOSData
                : globalOOSData.filter((d) => d.remarkKey === activeRemark);
        }

        function applyRemarkFilter() {
            activeRemark = document.getElementById("remarkPicker").value;
            renderReport();
        }

        // A row is one point measured in one inspection, so the row count is
        // how many points the remark affected. Distinct zones is the other
        // question people ask — twelve points on one zone across a month is a
        // different story from twelve zones once each.
        function partSummary(rows) {
            const map = new Map();
            rows.forEach((r) => {
                if (!map.has(r.part)) {
                    map.set(r.part, {
                        part: r.part, points: 0,
                        zones: new Set(), machines: new Set(),
                        lastTs: 0, lastDate: ""
                    });
                }
                const s = map.get(r.part);
                s.points += 1;
                if (r.zone && r.zone !== "-") s.zones.add(String(r.zone));
                if (r.machine && r.machine !== "N/A") s.machines.add(r.machine);
                if (r.ts > s.lastTs) { s.lastTs = r.ts; s.lastDate = r.date; }
            });
            return [...map.values()]
                .sort((a, b) => b.points - a.points || a.part.localeCompare(b.part));
        }

        function activeRemarkLabel() {
            if (activeRemark === "__all__") return "All remarks";
            const g = remarkGroups.find((x) => x.key === activeRemark);
            return g ? g.label : "All remarks";
        }

        function summaryHtml(rows) {
            const summary = partSummary(rows);
            const group = remarkGroups.find((x) => x.key === activeRemark);

            // Say out loud when a group folded more than one spelling together,
            // so a count nobody can reproduce by eye is explained rather than
            // just wrong-looking.
            const spellings = (group && group.spellings.size > 1)
                ? ` Written ${group.spellings.size} different ways this month, counted as one: `
                + [...group.spellings].map((s) => `"${esc(s)}"`).join(", ") + "."
                : "";

            const caption = activeRemark === "__all__"
                ? `Every out-of-spec point this month, whatever the remark says.`
                : `Points whose remark is <strong>${esc(activeRemarkLabel())}</strong>.${spellings}`;

            let html = `<div class="summary-panel">
                <h3>Affected parts — ${esc(activeRemarkLabel())}</h3>
                <p class="summary-caption">${caption}</p>
                <table class="summary-table">
                    <thead><tr>
                        <th>Part Name / No</th>
                        <th class="num">Points Affected</th>
                        <th class="num">Distinct Zones</th>
                        <th>Machines</th>
                        <th>Last Seen</th>
                    </tr></thead>
                    <tbody>`;

            summary.forEach((s) => {
                html += `<tr>
                    <td>${esc(s.part)}</td>
                    <td class="num">${s.points}</td>
                    <td class="num">${s.zones.size}</td>
                    <td>${esc([...s.machines].sort().join(", ") || "-")}</td>
                    <td>${esc(s.lastDate)}</td>
                </tr>`;
            });

            const zones = new Set();
            rows.forEach((r) => { if (r.zone && r.zone !== "-") zones.add(r.part + "|" + r.zone); });

            html += `<tr class="summary-total">
                    <td>${summary.length} part${summary.length === 1 ? "" : "s"}</td>
                    <td class="num">${rows.length}</td>
                    <td class="num">${zones.size}</td>
                    <td></td><td></td>
                </tr></tbody></table></div>`;
            return html;
        }

        async function generateReport() {
            const selectedMonth = document.getElementById("monthPicker").value;
            activeMonth = selectedMonth;
            const container = document.getElementById("reportContent");
            container.innerHTML = "<p style='text-align:center'>Fetching and sorting data...</p>";

            let start = dayjs(selectedMonth).startOf('month').toISOString();
            let end = dayjs(selectedMonth).endOf('month').toISOString();

            const { data, error } = await _supabase.from("Data_IPQC").select("*").gte("created_at", start).lte("created_at", end);

            if (error) { container.innerHTML = `<p style='color:red; text-align:center;'>Error: ${error.message}</p>`; return; }

            const oosRecords = data.filter(row => {
                const lsl = parseFloat(row.LSL_OK), usl = parseFloat(row.USL_NG);
                const r = [row.Reading_1, row.Reading_2, row.Reading_3];
                if (r.some(v => String(v || "").toUpperCase().includes("STOP"))) return false;
                return r.some(val => {
                    const n = parseFloat(val);
                    return !isNaN(n) && ((!isNaN(lsl) && n < lsl) || (!isNaN(usl) && n > usl));
                });
            });

            if (oosRecords.length === 0) {
                globalOOSData = [];
                remarkGroups = [];
                fillRemarkPicker();
                container.innerHTML = `<div style="text-align:center; padding:50px;"><p style="color:#64748b;">No Numeric OOS Found</p></div>`;
                document.getElementById("exportBtn").disabled = true;
                return;
            }

            globalOOSData = oosRecords.map(row => ({
                id: row.id, date: dayjs(row.created_at).format("YYYY-MM-DD HH:mm"),
                machine: row.Machine || "N/A", process: row.Process || "N/A", part: row.Part_Name || "N/A",
                zone: row.Point_DWG_Zone || "-", r1: row.Reading_1, r2: row.Reading_2, r3: row.Reading_3,
                lsl: row.LSL_OK, usl: row.USL_NG, remarks: row.Remarks || "", ts: dayjs(row.created_at).unix(),
                // Carried on the row so the filter and the grouping never disagree
                // about what a remark says.
                remarkCategory: remarkCategory(row.Remarks),
                remarkKey: remarkKey(row.Remarks)
            })).sort((a, b) => b.ts - a.ts);

            remarkGroups = buildRemarkGroups(globalOOSData);
            fillRemarkPicker();
            renderReport();
        }

        async function saveRemark(element, rowId) {
            const text = element.innerText.trim();
            element.classList.add('saving');
            await _supabase.from("Data_IPQC").update({ Remarks: text }).eq("id", rowId);
            element.classList.remove('saving');

            // The remark that was just edited is what the picker groups on, so
            // the list and its counts are rebuilt rather than left describing
            // the text that used to be there. Re-rendering is what keeps a row
            // from sitting under a filter it no longer matches; the scroll
            // position is put back because the edit was made mid-table.
            const row = globalOOSData.find((d) => String(d.id) === String(rowId));
            if (row) {
                row.remarks = text;
                row.remarkCategory = remarkCategory(text);
                row.remarkKey = remarkKey(text);
                remarkGroups = buildRemarkGroups(globalOOSData);
                fillRemarkPicker();
                const y = window.scrollY;
                renderReport();
                window.scrollTo(0, y);
            }
        }

        function renderReport() {
            const container = document.getElementById("reportContent");
            const rowsShown = visibleRows();
            const monthLabel = activeMonth ? dayjs(activeMonth).format("MMMM YYYY") : "";

            container.innerHTML =
                `<h2 style="text-align:center; font-size: 16px; margin-bottom: 20px;">Quality Exceptions: ${esc(monthLabel)}</h2>`
                + summaryHtml(rowsShown);

            document.getElementById("exportBtn").disabled = rowsShown.length === 0;

            if (rowsShown.length === 0) {
                container.innerHTML += `<div style="text-align:center; padding:40px;">
                    <p style="color:#64748b;">No out-of-spec point this month carries that remark.</p></div>`;
                return;
            }

            const parts = [...new Set(rowsShown.map(d => d.part))];

            parts.forEach(partName => {
                const rows = rowsShown.filter(d => d.part === partName);
                let html = `
            <div class="part-group-header">
                <span>PART: ${esc(partName)}</span>
                <span style="font-weight:400; font-size:11px;">OOS: ${rows.length}</span>
            </div>
            <div class="table-responsive">
            <table>
            <thead>
                <tr>
                    <th class="col-date">Date</th>
                    <th class="col-machine">Machine</th>
                    <th class="col-process">Process</th>
                    <th class="col-zone">Zone</th>
                    <th class="col-spec">LSL / USL</th>
                    <th class="col-read">R1</th>
                    <th class="col-read">R2</th>
                    <th class="col-read">R3</th>
                    <th class="col-remarks">Remarks</th>
                </tr>
            </thead>
            <tbody>`;

                rows.forEach(row => {
                    const formatReading = (v) => {
                        if (v === null || v === undefined || v === "") return "-";
                        const n = parseFloat(v);
                        if (isNaN(n)) return v;
                        const isOos = ((!isNaN(row.lsl) && n < row.lsl) || (!isNaN(row.usl) && n > row.usl));
                        return isOos ? `<span class="oos-bold">${esc(v)}</span>` : esc(v);
                    };

                    // NEW LOGIC: Break lines at / or |
                    // We add a newline (\n) after every / or | symbol
                    // Escaped first: the box is contenteditable and saves back
                    // what innerText reads, so a typed < has to stay a typed <
                    // rather than become the start of a tag.
                    const formattedRemarks = esc(row.remarks || '')
                        .replace(/\//g, '/\n')
                        .replace(/\|/g, '|\n');

                    html += `
                            <tr>
                                <td class="col-date">${esc(row.date)}</td>
                                <td class="col-machine"><b>${esc(row.machine)}</b></td>
                                <td class="col-process">${esc(row.process)}</td>
                                <td class="col-zone" style="text-align:center">${esc(row.zone)}</td>
                                <td class="col-spec" style="text-align:center">${esc(row.lsl || '-')} / ${esc(row.usl || '-')}</td>
                                <td class="col-read">${formatReading(row.r1)}</td>
                                <td class="col-read">${formatReading(row.r2)}</td>
                                <td class="col-read">${formatReading(row.r3)}</td>
                                <td class="col-remarks">
                                    <div class="remark-text" contenteditable="true" onblur="saveRemark(this, '${row.id}')">${formattedRemarks}</div>
                                </td>
                            </tr>`;
                });
                container.innerHTML += html + `</tbody></table></div>`;
            });
        }

        async function exportToExcel() {
            const monthLabel = dayjs(document.getElementById("monthPicker").value).format("MMMM_YYYY");
            // What was asked for on screen is what leaves the page. Exporting the
            // whole month from a filtered view would hand somebody a workbook
            // that does not match the report they were reading.
            const rowsShown = visibleRows();
            const workbook = new ExcelJS.Workbook();

            // The affected-parts table first, because it is the answer; the
            // point-by-point detail is the working behind it.
            const summarySheet = workbook.addWorksheet('Affected Parts');
            summarySheet.columns = [
                { header: 'Part Name / No', key: 'part', width: 42 },
                { header: 'Points Affected', key: 'points', width: 16 },
                { header: 'Distinct Zones', key: 'zones', width: 15 },
                { header: 'Machines', key: 'machines', width: 22 },
                { header: 'Last Seen', key: 'last', width: 20 }
            ];
            const sHead = summarySheet.getRow(1);
            sHead.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            sHead.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } };

            const remarkRow = summarySheet.addRow(['REMARK: ' + activeRemarkLabel()]);
            summarySheet.mergeCells(remarkRow.number, 1, remarkRow.number, 5);
            remarkRow.font = { bold: true };
            remarkRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF1F5F9' } };

            partSummary(rowsShown).forEach((s) => {
                summarySheet.addRow({
                    part: s.part,
                    points: s.points,
                    zones: s.zones.size,
                    machines: [...s.machines].sort().join(', '),
                    last: s.lastDate
                });
            });

            const sheet = workbook.addWorksheet('Numeric OOS');

            // 1. Setup Columns
            sheet.columns = [
                { header: 'Date & Time', key: 'date', width: 20 },
                { header: 'Machine', key: 'machine', width: 12 },
                { header: 'Process', key: 'process', width: 20 },
                { header: 'Zone', key: 'zone', width: 10 },
                { header: 'LSL', key: 'lsl', width: 10 },
                { header: 'USL', key: 'usl', width: 10 },
                { header: 'Reading 1', key: 'r1', width: 12 },
                { header: 'Reading 2', key: 'r2', width: 12 },
                { header: 'Reading 3', key: 'r3', width: 12 },
                { header: 'Remarks', key: 'remarks', width: 40 }
            ];

            // Style the main header
            const headerRow = sheet.getRow(1);
            headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            headerRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } }; // Blue header

            // 2. Grouping Logic (Same as display)
            const parts = [...new Set(rowsShown.map(d => d.part))];

            parts.forEach(partName => {
                const partRows = rowsShown.filter(d => d.part === partName);

                // Add a Part Group Header Row
                const groupHeader = sheet.addRow(['PART: ' + partName]);
                sheet.mergeCells(groupHeader.number, 1, groupHeader.number, 10); // Merge across all columns

                groupHeader.font = { bold: true };
                groupHeader.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF1F5F9' } }; // Light grey background
                groupHeader.border = { bottom: { style: 'thin', color: { argb: 'FFE11D48' } } };

                // Add Data Rows for this part
                partRows.forEach(row => {
                    const excelRow = sheet.addRow({
                        date: row.date,
                        machine: row.machine,
                        process: row.process,
                        zone: row.zone,
                        lsl: row.lsl,
                        usl: row.usl,
                        r1: row.r1,
                        r2: row.r2,
                        r3: row.r3,
                        remarks: row.remarks
                    });

                    // Highlight OOS cells in Red text within Excel
                    const readings = ['r1', 'r2', 'r3'];
                    const lsl = parseFloat(row.lsl);
                    const usl = parseFloat(row.usl);

                    readings.forEach((key, index) => {
                        const cell = excelRow.getCell(7 + index); // R1 starts at column 7
                        const val = parseFloat(cell.value);
                        if (!isNaN(val)) {
                            if ((!isNaN(lsl) && val < lsl) || (!isNaN(usl) && val > usl)) {
                                cell.font = { color: { argb: 'FFE11D48' }, bold: true };
                            }
                        }
                    });
                });

                // Add an empty row for spacing
                sheet.addRow([]);
            });

            // 3. Finalize and Download
            const buffer = await workbook.xlsx.writeBuffer();
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([buffer]));
            // The remark is in the name, so two exports of the same month do not
            // land in Downloads as the same file with (1) after it.
            const remarkSlug = activeRemark === "__all__"
                ? ""
                : "_" + activeRemarkLabel().replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 40);
            link.download = `Numeric_OOS_Report_${monthLabel}${remarkSlug}.xlsx`;
            link.click();
        }
    </script>
